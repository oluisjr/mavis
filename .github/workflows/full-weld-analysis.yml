name: Full weld-analysis validation
on:
  push:
    branches: ["feat/weld-level-monitoring"]
  pull_request:
    paths:
      - "app/weld_*.py"
      - "pages/2_*"
      - "scripts/check_weld_full.py"
jobs:
  full-weld:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.check_weld_full
