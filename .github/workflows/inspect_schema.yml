name: Inspect data structure
on:
  push:
    branches: ["feat/weld-level-monitoring"]
jobs:
  schema-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyarrow pandas openpyxl
      - run: python scripts/inspect_schema.py
